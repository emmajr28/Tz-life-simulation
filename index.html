
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bongo Life 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#9dd8ff;font-family:Arial;color:white}
#game{position:fixed;inset:0}
#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}
.panel{background:#10231ddd;padding:12px;border-radius:12px;font-size:13px;line-height:1.7}
#help{position:absolute;top:105px;left:12px;background:#10231dcc;padding:8px;border-radius:8px;font-size:12px}
#controls{position:absolute;bottom:22px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 18px}
.pad{display:grid;grid-template-columns:54px 54px 54px;grid-template-rows:54px 54px;gap:5px}
button{border:1px solid #ffffff77;border-radius:14px;background:#172b39dd;color:white;font-size:23px;touch-action:none}
.pad button{width:54px;height:54px}
#up{grid-column:2;grid-row:1}
#left{grid-column:1;grid-row:2}
#down{grid-column:2;grid-row:2}
#right{grid-column:3;grid-row:2}
#actions{display:flex;flex-direction:column;gap:10px}
#actions button{padding:12px;font-size:13px}
#look{position:absolute;right:20px;bottom:165px;font-size:11px;background:#172b39cc;padding:8px;border-radius:8px}
</style>
</head>
<body>
<div id="game"></div>

<div id="hud">
  <div class="panel">
    <b>🇹🇿 BONGO LIFE 3D</b><br>
    Day <span id="day">1</span> | Dar es Salaam
  </div>
  <div class="panel">
    Cash: TSh <span id="cash">10,000</span><br>
    Energy: <span id="energy">100</span>%
  </div>
</div>

<div id="help">Explore the city • Move to walk</div>
<div id="look">Drag the screen to look around</div>

<div id="controls">
  <div class="pad">
    <button id="up">▲</button>
    <button id="left">◀</button>
    <button id="down">▼</button>
    <button id="right">▶</button>
  </div>
  <div id="actions">
    <button id="work">💼 Find work</button>
    <button id="food">🍔 Buy food</button>
    <button id="run">🏃 Run: OFF</button>
  </div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9dd8ff);
scene.fog = new THREE.Fog(0x9dd8ff, 45, 150);

const camera = new THREE.PerspectiveCamera(
  65, innerWidth / innerHeight, 0.1, 300
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x62734b,2));

const sun = new THREE.DirectionalLight(0xffffff,2.5);
sun.position.set(-25,40,20);
sun.castShadow = true;
scene.add(sun);

function material(color){
  return new THREE.MeshStandardMaterial({color,roughness:0.9});
}
const green=material(0x6eaa58);
const roadmat=material(0x42474c);
const concrete=material(0xc5c4b9);
const white=material(0xffffff);

function cube(w,h,d,mat,x,y,z,parent=scene){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);
  m.castShadow=true;
  m.receiveShadow=true;
  parent.add(m);
  return m;
}

// Ground and roads
cube(220,0.3,220,green,0,-0.2,0);
cube(15,0.12,200,roadmat,0,0,-10);
cube(200,0.12,13,roadmat,0,0,-12);

for(let z=-100;z<100;z+=8){
  cube(0.18,0.025,3,white,0,0.08,z);
}
for(let x=-95;x<100;x+=8){
  cube(3,0.025,0.18,white,x,0.08,-12);
}

// Sidewalks
cube(2,0.2,200,concrete,-9,0,-10);
cube(2,0.2,200,concrete,9,0,-10);
cube(200,0.2,2,concrete,0,0,-19);

// Buildings
const colors=[
  0xe5c7a0,0xd8d6c8,0xc6a18b,
  0xf0d5aa,0xb8c8c7,0xd9b5a0
];

function building(x,z,w,d,h,color){
  const bmat=material(color);
  cube(w,h,d,bmat,x,h/2,z);

  // Roof edge
  cube(w+0.25,0.18,d+0.25,
       material(0x8b8980),x,h+0.08,z);

  // Windows
  const glass=material(0x537d91);
  const floors=Math.max(1,Math.floor(h/3));
  const cols=Math.max(1,Math.floor(w/2.3));

  for(let f=0;f<floors;f++){
    for(let c=0;c<cols;c++){
      const wx=x-w/2+(c+0.5)*w/cols;
      const wy=1.3+f*2.5;
      if(wy<h-0.3){
        cube(0.8,1.1,0.06,glass,wx,wy,z-d/2-0.04);
      }
    }
  }

  // Shopfront
  if(h<8){
    cube(1.4,1.6,0.08,glass,x-1,0.95,z-d/2-0.06);
    cube(1.2,0.12,0.35,material(0xe8b83f),
         x,h+0.4,z-d/2-0.1);
  }
}

for(let z=-75;z<75;z+=19){
  building(-16,z,8,10,5+Math.random()*5,
    colors[Math.floor(Math.random()*colors.length)]);
  building(16,z,9,10,6+Math.random()*12,
    colors[Math.floor(Math.random()*colors.length)]);
}

for(let x=-75;x<=75;x+=17){
  if(Math.abs(x)>12){
    building(x,-29,9,9,5+Math.random()*6,
      colors[Math.floor(Math.random()*colors.length)]);
  }
}

// Trees
const trunkmat=material(0x755036);
const leafmat=material(0x287849);

function tree(x,z){
  cube(0.45,2,0.45,trunkmat,x,1,z);
  const crown=new THREE.Mesh(
    new THREE.SphereGeometry(1.6,8,7),leafmat
  );
  crown.position.set(x,3,z);
  crown.castShadow=true;
  scene.add(crown);
}
for(let z=-85;z<85;z+=12){
  tree(-11,z);
  tree(11,z+4);
}


 // Character group: smoother 3D player
const player = new THREE.Group();
scene.add(player);

const skin = material(0x8c5938);
const shirt = material(0x2364a1);
const pants = material(0x292e38);
const shoes = material(0x202020);
const hair = material(0x171311);
const eyesMat = material(0x171717);

function oval(w, h, d, mat, x, y, z, parent) {
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(1, 20, 16),
    mat
  );
  mesh.scale.set(w, h, d);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function limb(radius, height, mat, x, y, parent) {
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radius * 0.85, radius, height, 16),
    mat
  );
  mesh.position.set(x, y, 0);
  mesh.castShadow = true;
  parent.add(mesh);
  return mesh;
}

// Torso, neck and head
oval(0.43, 0.55, 0.27, shirt, 0, 1.55, 0, player);
limb(0.13, 0.18, skin, 0, 2.08, player);
oval(0.29, 0.34, 0.28, skin, 0, 2.35, 0, player);

// Hair and face
oval(0.29, 0.13, 0.29, hair, 0, 2.61, 0.015, player);
oval(0.055, 0.045, 0.025, eyesMat, -0.105, 2.38, -0.253, player);
oval(0.055, 0.045, 0.025, eyesMat, 0.105, 2.38, -0.253, player);
oval(0.045, 0.055, 0.045, skin, 0, 2.30, -0.285, player);

// Legs
const legs = [];
for (const x of [-0.21, 0.21]) {
  const leg = new THREE.Group();
  leg.position.set(x, 1.12, 0);
  player.add(leg);

  limb(0.13, 0.67, pants, 0, -0.30, leg);
  oval(0.15, 0.09, 0.23, shoes, 0, -0.65, -0.07, leg);
  legs.push(leg);
}

// Arms with shoulder pivots
const arms = [];
for (const x of [-0.49, 0.49]) {
  const arm = new THREE.Group();
  arm.position.set(x, 1.87, 0);
  player.add(arm);

  limb(0.105, 0.61, shirt, 0, -0.31, arm);
  oval(0.095, 0.12, 0.10, skin, 0, -0.66, 0, arm);
  arms.push(arm);
}

player.position.set(0,0,5);

let cash=10000,energy=100,day=1;
let yaw=0,running=false;
const keys={up:false,down:false,left:false,right:false};
const velocity=new THREE.Vector3();

function bind(id,key){
  const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{
    e.preventDefault();keys[key]=true;
    el.setPointerCapture(e.pointerId);
  });
  const release=e=>{keys[key]=false};
  el.addEventListener('pointerup',release);
  el.addEventListener('pointercancel',release);
  el.addEventListener('lostpointercapture',release);
}
bind('up','up');
bind('down','down');
bind('left','left');
bind('right','right');

document.getElementById('run').onclick=()=>{
  running=!running;
  document.getElementById('run').textContent=
    '🏃 Run: '+(running?'ON':'OFF');
};

document.getElementById('work').onclick=()=>{
  cash+=5000;
  energy=Math.max(0,energy-15);
  document.getElementById('cash').textContent=
    cash.toLocaleString('en-US');
  document.getElementById('energy').textContent=energy;
  alert('You completed a small job! +TSh 5,000');
};

document.getElementById('food').onclick=()=>{
  if(cash>=1000){
    cash-=1000;
    energy=Math.min(100,energy+25);
    document.getElementById('cash').textContent=
      cash.toLocaleString('en-US');
    document.getElementById('energy').textContent=energy;
    alert('You bought food! Energy restored.');
  }else alert('Not enough money!');
};

// Drag screen to rotate camera
let dragging=false,lastX=0;
renderer.domElement.addEventListener('pointerdown',e=>{
  dragging=true;lastX=e.clientX;
});
renderer.domElement.addEventListener('pointermove',e=>{
  if(dragging){
    yaw-=(e.clientX-lastX)*0.006;
    lastX=e.clientX;
  }
});
renderer.domElement.addEventListener('pointerup',()=>dragging=false);
renderer.domElement.addEventListener('pointercancel',()=>dragging=false);

const clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);

  let forward=0,side=0;
  if(keys.up)forward+=1;
  if(keys.down)forward-=1;
  if(keys.left)side-=1;
  if(keys.right)side+=1;

  const moving=forward!==0||side!==0;
  const speed=running?8:4;

  if(moving){
    const len=Math.hypot(forward,side);
    forward/=len;side/=len;

    const fx=-Math.sin(yaw);
    const fz=-Math.cos(yaw);
    const rx=Math.cos(yaw);
    const rz=-Math.sin(yaw);

    player.position.x+=(fx*forward+rx*side)*speed*dt;
    player.position.z+=(fz*forward+rz*side)*speed*dt;

    player.rotation.y=Math.atan2(
      fx*forward+rx*side,
      fz*forward+rz*side
    )+Math.PI;

    legs[0].rotation.x=Math.sin(performance.now()*0.012)*0.6;
    legs[1].rotation.x=-legs[0].rotation.x;

    if(running)energy=Math.max(0,energy-3*dt);
  }else{
    legs[0].rotation.x=0;
    legs[1].rotation.x=0;
  }

  // Follow camera from behind
  const distance=7;
  const height=4;
  const target=new THREE.Vector3(
    player.position.x+Math.sin(yaw)*distance,
    height,
    player.position.z+Math.cos(yaw)*distance
  );

  camera.position.lerp(target,1-Math.exp(-5*dt));
  camera.lookAt(
    player.position.x,
    player.position.y+1.4,
    player.position.z
  );

  document.getElementById('energy').textContent=
    Math.round(energy);

  renderer.render(scene,camera);
}

camera.position.set(0,4,12);
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
